name: Update ratings

on:
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

concurrency:
  group: ratings-update
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aggregate ratings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/aggregate_ratings.py

      - name: Commit changes
        run: |
          if ! git diff --quiet -- data/ratings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ratings.json
            git commit -m "chore: update ratings [skip ci]"
            git push
          else
            echo "Ratings are unchanged."
          fi
